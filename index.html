<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloître</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <header class="controls">
      <button id="pick-folder" type="button">Choose a folder</button>
      <label>
        Renderer
        <select id="renderer">
          <option value="dom" selected>DOM</option>
          <option value="webgl">WebGL</option>
        </select>
      </label>
      <label>
        Unicode widths
        <select id="unicode">
          <option value="6">6</option>
          <option value="11" selected>11</option>
        </select>
      </label>
      <button id="mark" type="button" title="Mark the recording (F9)">Mark</button>
      <span id="recording" hidden></span>
      <label>
        Recording
        <select id="recordings"></select>
      </label>
      <select id="replay-speed" aria-label="Replay speed">
        <option value="instant" selected>Instant</option>
        <option value="realtime">Real time</option>
      </select>
      <button id="replay" type="button">Replay</button>
      <button id="next-mark" type="button">Next mark</button>
      <button id="stop-replay" type="button">Stop replay</button>
      <span id="status">No folder chosen</span>
    </header>
    <div id="terminal"></div>
  </body>
</html>
