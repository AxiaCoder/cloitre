<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloître</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div id="warning" class="warning" role="alert" hidden>
      <span id="warning-text"></span>
      <button id="warning-close" type="button" aria-label="Close the warning">×</button>
    </div>
    <header class="controls">
      <label>
        Renderer
        <select id="renderer">
          <option value="dom">DOM</option>
          <option value="webgl" selected>WebGL</option>
        </select>
      </label>
      <label>
        Unicode widths
        <select id="unicode">
          <option value="6">6</option>
          <option value="15">15</option>
          <option value="15-graphemes" selected>15 + graphemes</option>
        </select>
      </label>
      <button id="mark" type="button" title="Mark the recording (F9)">Mark</button>
      <span id="recording" hidden></span>
      <label>
        Recording
        <select id="recordings"></select>
      </label>
      <select id="replay-speed" aria-label="Replay speed">
        <option value="instant" selected>Instant</option>
        <option value="realtime">Real time</option>
      </select>
      <button id="replay" type="button">Replay</button>
      <button id="next-mark" type="button">Next mark</button>
      <button id="stop-replay" type="button">Stop replay</button>
      <span id="status">No session</span>
    </header>
    <div class="workspace">
      <nav class="rail" aria-label="Projects">
        <h2>Projects</h2>
        <ul id="project-list"></ul>
        <button id="add-project" type="button">＋ Open a folder</button>
      </nav>
      <main class="work">
        <div id="tab-bar" class="tab-bar" hidden>
          <div id="tab-list" class="tab-list" role="tablist" aria-label="Sessions"></div>
          <button id="new-tab" class="new-tab" type="button" title="New session" aria-label="New session">+</button>
        </div>
        <div id="terminals" class="terminals"></div>
        <section id="empty-state" class="state" hidden>
          <h1>No project open</h1>
          <p>Each folder you open becomes a project, with its own Claude Code sessions.</p>
          <button id="empty-open" class="primary" type="button">Open a folder</button>
        </section>
        <section id="missing-state" class="state" hidden>
          <h1>The project folder cannot be found</h1>
          <p id="missing-path" class="path"></p>
          <p>It may have been moved or renamed.</p>
          <div class="actions">
            <button id="relocate" class="primary" type="button">Choose another folder</button>
            <button id="remove" type="button">Remove the project</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
