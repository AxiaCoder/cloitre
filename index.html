<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloître</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div id="warning" class="warning" role="alert" hidden>
      <span id="warning-text"></span>
      <button id="warning-close" type="button" data-label="closeWarning">×</button>
    </div>
    <header id="controls" class="controls" data-label="devTools" hidden>
      <label>
        <span data-text="renderer"></span>
        <select id="renderer">
          <option value="dom" data-text="rendererDom"></option>
          <option value="webgl" data-text="rendererWebgl" selected></option>
        </select>
      </label>
      <label>
        <span data-text="unicodeWidths"></span>
        <select id="unicode">
          <option value="6">6</option>
          <option value="15">15</option>
          <option value="15-graphemes" data-text="unicode15Graphemes" selected></option>
        </select>
      </label>
      <button id="mark" type="button" data-text="mark" data-title="markTitle"></button>
      <span id="recording" hidden></span>
      <label>
        <span data-text="recording"></span>
        <select id="recordings"></select>
      </label>
      <select id="replay-speed" data-label="replaySpeed">
        <option value="instant" data-text="speedInstant" selected></option>
        <option value="realtime" data-text="speedRealtime"></option>
      </select>
      <button id="replay" type="button" data-text="replay"></button>
      <button id="next-mark" type="button" data-text="nextMark"></button>
      <button id="stop-replay" type="button" data-text="stopReplay"></button>
      <span id="status" role="status" data-text="noSession"></span>
    </header>
    <div class="workspace">
      <nav class="rail" data-label="projects">
        <h2 data-text="projects"></h2>
        <ul id="project-list"></ul>
        <button id="add-project" type="button" data-label="openFolder" data-title="openFolder"><span aria-hidden="true">＋</span> <span class="add-label" aria-hidden="true" data-text="openFolder"></span></button>
      </nav>
      <main class="work">
        <div id="tab-bar" class="tab-bar" hidden>
          <div id="tab-list" class="tab-list" role="tablist" data-label="sessions"></div>
          <button id="new-tab" class="new-tab" type="button" data-title="newSession" data-label="newSession">+</button>
          <span id="cwd" class="cwd"></span>
        </div>
        <div id="terminals" class="terminals"></div>
        <section id="empty-state" class="state" hidden>
          <h1 data-text="noProjectOpen"></h1>
          <p data-text="noProjectHint"></p>
          <button id="empty-open" class="primary" type="button" data-text="openFolder"></button>
        </section>
        <section id="no-session-state" class="state" hidden>
          <h1 id="no-session-title"></h1>
          <p><span data-text="newSessionStartsIn"></span> <span id="no-session-path" class="path"></span>.</p>
          <button id="no-session-start" class="primary" type="button" data-text="startClaude"></button>
        </section>
        <section id="missing-state" class="state" hidden>
          <h1 data-text="missingFolderTitle"></h1>
          <p id="missing-path" class="path"></p>
          <p data-text="missingFolderHint"></p>
          <div class="actions">
            <button id="relocate" class="primary" type="button" data-text="chooseAnotherFolder"></button>
            <button id="remove" type="button" data-text="removeProject"></button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
