name: Set up toolchain
description: >-
  Installs the pinned pnpm, Node.js and Rust versions, restores the Rust cache,
  installs the dependencies from the lockfile and creates the dist folder.
  The repository must already be checked out. Runs on Windows.

inputs:
  rust-components:
    description: Extra rustup components, comma-separated (for example clippy).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: "10.23.0"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26.7.0"
        cache: pnpm

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: "1.99.1"
        components: ${{ inputs.rust-components }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src-tauri

    - shell: pwsh
      run: pnpm install --frozen-lockfile

    # Tauri's build script requires the frontendDist folder to exist.
    - shell: pwsh
      run: New-Item -ItemType Directory -Force dist
