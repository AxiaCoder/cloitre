name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with GITHUB_TOKEN would not trigger checks.yml.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  build:
    name: build installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: conpty files
        run: ./scripts/check-conpty.ps1

      - name: build the signed NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.release.conf.json

      # The installed apps read latest.json from the latest published release.
      - name: attach the installer, its signature and latest.json to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/Cloitre_*_x64-setup.exe
          if (@($installer).Count -ne 1) { throw "expected one installer, found $(@($installer).Count)" }
          $signature = Get-Item "$($installer.FullName).sig"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = (gh release view $env:TAG_NAME --json body --jq .body) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "reading the release notes failed" }
          $manifest = [ordered]@{
            version = $version
            notes = ($notes -split "`n## Checks`n")[0].TrimEnd()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $signature.FullName -Raw).Trim()
                url = "https://github.com/$env:GH_REPO/releases/download/$env:TAG_NAME/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8NoBOM
          gh release upload $env:TAG_NAME $installer.FullName $signature.FullName latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "uploading the release files failed" }

      # Exit codes of MpCmdRun -Scan: 0 no threat, 2 threat found.
      # The runner image excludes C:\ and D:\ from Defender and turns off archive scanning.
      # The EICAR test file proves the scan inspects files before the installer is scanned.
      - name: scan the installer with Microsoft Defender, publish the checksums and note both in the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/Cloitre_*_x64-setup.exe
          $signature = Get-Item "$($installer.FullName).sig"
          $manifest = Get-Item latest.json

          $mpcmdrun = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mpcmdrun -SignatureUpdate | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Defender definitions update failed with $LASTEXITCODE" }
          $definitions = (Get-MpComputerStatus).AntivirusSignatureVersion

          Remove-MpPreference -ExclusionPath (Get-MpPreference).ExclusionPath -ErrorAction SilentlyContinue
          Set-MpPreference -DisableArchiveScanning $false
          if ((Get-MpPreference).ExclusionPath) { throw "Defender still has path exclusions: $((Get-MpPreference).ExclusionPath -join ', ')" }
          $eicar = Join-Path $env:RUNNER_TEMP 'eicar.com'
          [IO.File]::WriteAllBytes($eicar, [Convert]::FromBase64String('WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo='))
          & $mpcmdrun -Scan -ScanType 3 -File $eicar -DisableRemediation | Out-Host
          if ($LASTEXITCODE -ne 2) { throw "Defender did not detect the EICAR test file (exit $LASTEXITCODE): its scan cannot be trusted" }

          & $mpcmdrun -Scan -ScanType 3 -File $installer.FullName -DisableRemediation | Out-Host
          $scanExitCode = $LASTEXITCODE
          $verdict = switch ($scanExitCode) {
            0 { 'no threat found' }
            2 { 'THREAT FOUND' }
            default { throw "MpCmdRun exited with $scanExitCode" }
          }

          $checksums = foreach ($file in $installer, $signature, $manifest) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          Set-Content SHA256SUMS.txt (($checksums -join "`n") + "`n") -NoNewline -Encoding utf8NoBOM
          gh release upload $env:TAG_NAME SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "uploading SHA256SUMS.txt failed" }

          $notes = (gh release view $env:TAG_NAME --json body --jq .body) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "reading the release notes failed" }
          $notes = ($notes -split "`n## Checks`n")[0].TrimEnd()
          $checks = @(
            '## Checks'
            ''
            "- Microsoft Defender, definitions $definitions, on ``$($installer.Name)``: $verdict."
            '- SHA-256 checksums: `SHA256SUMS.txt`. See "Check the download" in the README.'
          ) -join "`n"
          Set-Content release-notes.md "$notes`n`n$checks" -Encoding utf8NoBOM
          gh release edit $env:TAG_NAME --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "writing the release notes failed" }
          if ($scanExitCode -ne 0) { throw "Microsoft Defender flagged $($installer.Name)" }
