name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with GITHUB_TOKEN would not trigger checks.yml.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  build:
    name: build installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: conpty files
        run: ./scripts/check-conpty.ps1

      - name: build the signed NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      # The installed apps read latest.json from the latest published release.
      - name: attach the installer, its signature and latest.json to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/Cloitre_*_x64-setup.exe
          if (@($installer).Count -ne 1) { throw "expected one installer, found $(@($installer).Count)" }
          $signature = Get-Item "$($installer.FullName).sig"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = gh release view $env:TAG_NAME --json body --jq .body
          $manifest = [ordered]@{
            version = $version
            notes = ($notes -join "`n")
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $signature.FullName -Raw).Trim()
                url = "https://github.com/$env:GH_REPO/releases/download/$env:TAG_NAME/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8NoBOM
          gh release upload $env:TAG_NAME $installer.FullName $signature.FullName latest.json --clobber
