name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: install
        uses: ./.github/actions/setup-toolchain
        with:
          rust-components: clippy

      - name: pnpm lint
        run: pnpm lint

      - name: conpty files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/check-conpty.ps1

      - name: pnpm typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: pnpm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: cargo clippy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: src-tauri
        run: cargo test
